<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基隆北海岸沿海與異常波浪（瘋狗浪）預報，查看中央氣象署每日更新的波浪資訊及互動地圖。">
    <meta property="og:title" content="基隆北海岸瘋狗浪預報">
    <meta property="og:description" content="查看中央氣象署每日更新的基隆北海岸波浪預報資訊">
    <meta property="og:image" content="https://keelungcwa.github.io/waverisk/images/CWA_waverisk.png">
    <meta property="og:url" content="https://keelungcwa.github.io/waverisk/">
    <meta name="twitter:card" content="summary_large_image">
    <title>基隆北海岸沿海與異常波浪（瘋狗浪）預報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f4f0;
            --surface: #ffffff;
            --surface-2: #f9f8f5;
            --border: rgba(0,0,0,0.08);
            --border-md: rgba(0,0,0,0.13);
            --text: #1a1917;
            --text-2: #6b6860;
            --text-3: #9b9890;
            --accent: #0f5fa5;
            --radius: 10px;
            --radius-lg: 14px;

            --risk-0-bg: #00A651;
            --risk-0-text: #ffffff;
            --risk-0-dot: rgba(255,255,255,0.7);
            --risk-1-bg: #FFF200;
            --risk-1-text: #5a4400;
            --risk-1-dot: #c8a800;
            --risk-2-bg: #ED1C24;
            --risk-2-text: #ffffff;
            --risk-2-dot: rgba(255,255,255,0.7);
            --risk-3-bg: #EE00EE;
            --risk-3-text: #ffffff;
            --risk-3-dot: rgba(255,255,255,0.7);
        }

        body.dark {
            --bg: #16151a;
            --surface: #1f1e24;
            --surface-2: #26252c;
            --border: rgba(255,255,255,0.08);
            --border-md: rgba(255,255,255,0.14);
            --text: #f0ede8;
            --text-2: #9b9890;
            --text-3: #5a5855;
            --accent: #5ba4e8;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── Header ── */
        .page-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px 16px;
        }
        .header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .site-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .site-subtitle {
            font-size: 13px;
            color: var(--text-2);
        }
        .update-badge {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-3);
            font-family: 'DM Mono', monospace;
        }
        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .author-info {
            font-size: 12px;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .home-link {
            text-decoration: none;
            font-size: 14px;
            line-height: 1;
        }
        .home-link:hover { opacity: 0.7; }
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-md);
            background: var(--surface-2);
            color: var(--text-2);
            font-size: 12px;
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .theme-toggle:hover { background: var(--border); color: var(--text); }

        /* ── Main layout ── */
        .page-body {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Card base ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .card-header {
            padding: 12px 16px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-2);
        }
        .card-body { padding: 16px; }

        /* ── Top row: map + info ── */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
        }

        /* ── Map ── */
        #map {
            height: 420px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* ── Forecast info panel ── */
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .info-panel .card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .info-panel .card-body {
            flex: 1;
            overflow-y: auto;
        }

        .forecast-time {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-3);
            margin-bottom: 12px;
        }
        .district-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label {
            font-size: 12px;
            color: var(--text-2);
        }
        .stat-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            text-align: right;
        }
        .stat-value.big {
            font-size: 15px;
            font-weight: 700;
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .risk-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .risk-0 { background: var(--risk-0-bg); color: var(--risk-0-text); }
        .risk-0 .risk-dot { background: var(--risk-0-dot); }
        .risk-1 { background: var(--risk-1-bg); color: var(--risk-1-text); }
        .risk-1 .risk-dot { background: var(--risk-1-dot); }
        .risk-2 { background: var(--risk-2-bg); color: var(--risk-2-text); }
        .risk-2 .risk-dot { background: var(--risk-2-dot); }
        .risk-3 { background: var(--risk-3-bg); color: var(--risk-3-text); }
        .risk-3 .risk-dot { background: var(--risk-3-dot); }

        .placeholder-text {
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.7;
        }

        /* ── Legend ── */
        .legend-inline {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-2);
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Bottom row: video + image ── */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .video-wrapper {
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface-2);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .video-placeholder {
            font-size: 12px;
            color: var(--text-3);
            text-align: center;
            padding: 20px;
        }

        .forecast-img-wrap {
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .forecast-img-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.2s;
        }
        .forecast-img-wrap img:hover { opacity: 0.92; }

        /* ── Share / actions ── */
        .actions-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid var(--border-md);
            background: var(--surface);
            color: var(--text);
            transition: background 0.15s, border-color 0.15s;
        }
        .btn:hover { background: var(--surface-2); border-color: rgba(0,0,0,0.2); }
        .btn-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ── Footer ── */
        .page-footer {
            max-width: 960px;
            margin: 4px auto 28px;
            padding: 0 16px;
        }
        .footer-text {
            font-size: 11px;
            color: var(--text-3);
            line-height: 1.8;
        }
        .footer-text a { color: var(--text-2); }

        /* ── Leaflet overrides ── */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12) !important;
            font-family: 'Noto Sans TC', sans-serif !important;
            font-size: 13px !important;
        }
        .custom-legend {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 12px;
            color: var(--text);
            line-height: 1.9;
            backdrop-filter: blur(4px);
        }
        .custom-legend span {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            .top-row { grid-template-columns: 1fr; }
            .bottom-row { grid-template-columns: 1fr; }
            #map { height: 300px; }
            .header-inner { gap: 6px; }
            .header-right { margin-left: 0; width: 100%; }
        }
    </style>
</head>

<script src="https://unpkg.com/topojson@3.0.2/dist/topojson.min.js"></script>
<script>
    // ── Forecast time ──
    function setForecastTime() {
        const el = document.getElementById('update-badge');
        if (!el) return;
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);
        const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
        el.textContent = `預報：${fmt(today)} 00時 ～ ${fmt(tomorrow)} 00時`;
    }

    // ── Map init ──
    const map = L.map('map', {
        zoomControl: false,
        minZoom: 8,
        maxBounds: [[21.8, 118.0], [26.5, 123.0]],
        maxBoundsViscosity: 1.0
    }).setView([25.14667, 121.78639], 10);

    L.control.zoom({ position: 'topright' }).addTo(map);

    const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    });
    const osmZhTW = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
    });
    cartoLight.addTo(map);
    L.control.layers({
        '🏙 CartoDB 淡色': cartoLight,
        '🗺 繁體中文街道圖': osmZhTW
    }, null, { position: 'topright', collapsed: true }).addTo(map);

    // ── Custom legend ──
    const legend = L.control({ position: 'topleft' });
    legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'custom-legend');
        div.innerHTML = [
            ['#EE00EE', '極高（≥6m）'],
            ['#ED1C24', '高（3–6m）'],
            ['#FFF200', '中（1.5–3m）'],
            ['#00A651', '低（0–1.5m）'],
        ].map(([c, t]) => `<div><span style="background:${c};border:1px solid rgba(0,0,0,0.15)"></span>${t}</div>`).join('');
        return div;
    };
    legend.addTo(map);

    // ── Locate button ──
    const locateControl = L.control({ position: 'topright' });
    locateControl.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar');
        div.style.cssText = 'background:#fff;cursor:pointer;padding:5px 7px;font-size:15px;line-height:1;border-radius:4px;';
        div.innerHTML = '⊕';
        div.title = '定位到我的位置';
        div.onclick = getUserLocation;
        return div;
    };
    locateControl.addTo(map);

    // ── Focus areas ──
    const focusAreas = {
        "基隆市": ["中正區", "中山區"],
        "新北市": ["貢寮區", "瑞芳區", "萬里區", "金山區", "石門區", "三芝區", "淡水區", "八里區", "林口區"],
        "桃園市": ["蘆竹區", "大園區", "觀音區", "新屋區"],
        "台北市": []
    };
    const northTaiwanBounds = [[24.7, 121.0], [25.5, 122.0]];

    // ── Video links — full iframe strings ──
    const videoLinks = {
        "基隆市_中正區": '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/N7mUGaV8zzw?si=qp8YH6nzVfOMiWn5&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        "基隆市_中山區": '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/N7mUGaV8zzw?si=qp8YH6nzVfOMiWn5&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',

        "桃園市_新屋區": '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/tD_a03trUvE?si=XFeOWqjr9MgspNKj&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        "桃園市_大園區": '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/wWEnxWA7nnY?si=oQktW1_78zZVuX-O&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>',
        "桃園市_蘆竹區": '<iframe width="100%" height="100%" src="https://www.youtube.com/embed/wWEnxWA7nnY?si=oQktW1_78zZVuX-O&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
    };

    // videoLinks 已是完整 iframe，直接使用不需要 makeIframe

    // ── Color by risk ──
    function getColor(level) {
        return ['#00A65180','#FFF20080','#ED1C2480','#EE00EE80'][level] || '#00A65180';
    }

    function getRiskClass(level) {
        return ['risk-0','risk-1','risk-2','risk-3'][level] || 'risk-0';
    }

    // ── Arrow mapping — SVG triangle pointer ──
    function getArrow(dir, isFlow) {
        const n = dir ? dir.replace(/偏|風/g, '') : '';
        // degrees: 0=up(北), clockwise. For wave/wind direction = "來自" so flip 180°.
        const degMap = { '北':0,'東北':45,'東':90,'東南':135,'南':180,'西南':225,'西':270,'西北':315 };
        if (!(n in degMap)) return '';
        let deg = degMap[n];
        if (!isFlow) deg = (deg + 180) % 360; // wave/wind: flip to show "coming from"
        return `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" style="display:inline-block;vertical-align:middle;transform:rotate(${deg}deg);margin-left:3px;"><polygon points="7,1 13,13 7,10 1,13" fill="currentColor"/></svg>`;
    }

    // ── Data ──
    let waveData = [];
    let topoData = null;

    Promise.all([
        fetch('https://keelungcwa.github.io/waverisk/data/waverisk_data.json').then(r => r.json()),
        fetch('https://keelungcwa.github.io/waverisk/data/twTown1982.topo.json').then(r => r.json())
    ]).then(([wave, topo]) => {
        waveData = wave;
        topoData = topo;
        addTopoLayer();
        getUserLocation();
        setForecastTime();
    }).catch(err => {
        console.error('載入資料失敗:', err);
        setForecastTime();
    });

    // ── TopoJSON layer ──
    function addTopoLayer() {
        if (!topoData?.objects?.layer1) return;
        const layer = L.geoJson(null, {
            style: function(f) {
                const county = f.properties.COUNTYNAME;
                const district = f.properties.TOWNNAME;
                const focused = focusAreas[county]?.includes(district);
                const data = waveData.find(d => d.county === county && d.district === district);
                return {
                    fillColor: data ? getColor(data.final_risk || 0) : '#FFFFFF00',
                    weight: focused ? 1.5 : 0.4,
                    opacity: 1,
                    color: focused ? '#555' : '#aaa',
                    fillOpacity: data ? 0.75 : 0
                };
            },
            onEachFeature: function(f, lyr) {
                const county = f.properties.COUNTYNAME;
                const district = f.properties.TOWNNAME;
                lyr.bindPopup(`<strong>${county} ${district}</strong>`);
                lyr.on('click', function() {
                    const data = waveData.find(d => d.county === county && d.district === district);
                    displayForecastInfo(data || {});
                });
                lyr.on('mouseover', function() { lyr.setStyle({ weight: 2, color: '#333' }); });
                lyr.on('mouseout', function() {
                    const focused = focusAreas[county]?.includes(district);
                    lyr.setStyle({ weight: focused ? 1.5 : 0.4, color: focused ? '#555' : '#aaa' });
                });
            },
            filter: f => f.geometry?.type === 'Polygon' || f.geometry?.type === 'MultiPolygon'
        });
        try {
            layer.addData(topojson.feature(topoData, topoData.objects.layer1)).addTo(map);
            map.fitBounds(northTaiwanBounds);
            setTimeout(() => map.invalidateSize(), 100);
        } catch(e) { console.error('TopoJSON 解析失敗:', e); }
    }

    // ── Display forecast ──
    function displayForecastInfo(d) {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);
        const fmt = x => `${x.getMonth()+1}/${x.getDate()}`;

        const infoEl = document.getElementById('forecast-info');
        const videoEl = document.getElementById('video-container');

        if (!d.county) {
            infoEl.innerHTML = `<p class="placeholder-text">點選地圖上的行政區<br>查看詳細預報資料</p>`;
            videoEl.innerHTML = `<p class="video-placeholder">點選地圖上的行政區<br>查看即時海況影像</p>`;
            return;
        }

        const riskClass = getRiskClass(d.final_risk || 0);

        infoEl.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
                <span style="font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-2)">預報資訊</span>
                <span style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text-3)">${fmt(today)} 00:00 ～ ${fmt(tomorrow)} 00:00</span>
            </div>
            <p class="district-name" style="margin-top:6px;">${d.county} ${d.district}沿海</p>

            <div class="stat-row" style="padding:8px 0;align-items:center;">
                <span class="stat-label">浪高</span>
                <span style="display:inline-flex;align-items:center;gap:6px;">
                    <span style="font-size:20px;font-weight:800;color:var(--text);line-height:1;">${d.wave_height_range || '—'} <small style="font-size:13px;font-weight:400;color:var(--text-2)">公尺</small></span>
                    <span class="${riskClass} risk-badge" style="font-size:11px;padding:2px 8px;"><span class="risk-dot"></span>${['低','中','高','極高'][d.final_risk ?? 0]}</span>
                </span>
            </div>
            <div class="stat-row">
                <span class="stat-label">浪向</span>
                <span class="stat-value">${d.wave_direction || '—'} ${getArrow(d.wave_direction, false)}</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">浪週期</span>
                <span class="stat-value">${d.wave_period_range || '—'} <small style="font-size:11px;color:var(--text-2)">秒</small></span>
            </div>
            <div class="stat-row" style="padding:8px 0;align-items:center;">
                <span class="stat-label">瘋狗浪風險</span>
                <span class="${riskClass} risk-badge"><span class="risk-dot"></span>${d.max_risk_label || '—'}</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">風速</span>
                <span class="stat-value">${d.wind_speed_range || '—'} <small style="font-size:11px;color:var(--text-2)">m/s</small> <small style="font-size:11px;color:var(--text-3)">(${d.beaufort_scale_range || '—'}級)</small></span>
            </div>
            <div class="stat-row">
                <span class="stat-label">風向</span>
                <span class="stat-value">${d.wind_direction || '—'} ${getArrow(d.wind_direction, false)}</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">流速</span>
                <span class="stat-value">${d.ocean_current_speed_range || '—'} <small style="font-size:11px;color:var(--text-2)">m/s</small></span>
            </div>
            <div class="stat-row" style="border-bottom:none;">
                <span class="stat-label">流向</span>
                <span class="stat-value">${d.ocean_current_direction || '—'} ${getArrow(d.ocean_current_direction, true)}</span>
            </div>
            <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
                <a href="https://www.cwa.gov.tw/V8/C/M/TownCoastal/TownCoastal.html?cID=10017&pointID=1001701C01" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:4px;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    氣象署鄉鎮沿海預報
                </a>
            </div>
        `;

        const key = `${d.county}_${d.district}`;
        const iframeHtml = videoLinks[key];
        videoEl.innerHTML = iframeHtml || `<p class="video-placeholder">無即時海況影像</p>`;
    }

    // ── Geolocation ──
    function getUserLocation() {
        if (!navigator.geolocation) { fallbackView(); return; }
        navigator.geolocation.getCurrentPosition(pos => {
            const { latitude: lat, longitude: lon } = pos.coords;
            let closest = null, minDist = Infinity;
            waveData.forEach(d => {
                if (d.latitude && d.longitude) {
                    const dist = Math.hypot(d.latitude - lat, d.longitude - lon);
                    if (dist < minDist) { minDist = dist; closest = d; }
                }
            });
            map.setView([lat, lon], 12);
            displayForecastInfo(closest || {});
        }, fallbackView);
    }

    function fallbackView() {
        map.setView([25.14667, 121.78639], 12);
        const def = waveData.find(d => d.county === '基隆市' && d.district === '中正區') || {};
        displayForecastInfo(def);
    }

    // ── Copy link ──
    function copyToClipboard() {
        navigator.clipboard.writeText('https://keelungcwa.github.io/waverisk/')
            .then(() => alert('連結已複製！'))
            .catch(() => alert('請手動複製連結。'));
    }

    // ── Theme toggle ──
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        document.getElementById('theme-label').textContent = isDark ? '白天模式' : '黑夜模式';
    }

    window.onload = () => {
        setForecastTime();
        setTimeout(() => map.invalidateSize(), 100);
    };
</script>
